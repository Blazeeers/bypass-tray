name: build-windows

# Собирает onedir-сборку «Обходы» и прикрепляет архив к релизу.
# Запуск: пуш тега вида v0.6.3 (или вручную из вкладки Actions).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверка синтаксиса
        run: python -m compileall -q src packaging

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Импорт-проверка
        env:
          PYTHONPATH: src
        run: |
          python -c "import bypass_tray.app, bypass_tray.health, bypass_tray.routes, bypass_tray.blocked, bypass_tray.guard, bypass_tray.updates, bypass_tray.ui, bypass_tray.settings_ui"

      - name: Подготовка bin (Xray и Re:filter)
        env:
          PYTHONPATH: src
        run: |
          python -c "from bypass_tray import blocked, xray; blocked.ensure(); assert xray.ensure_core()"

      - name: Иконка
        run: python packaging/make_icon.py

      - name: Сборка
        run: pyinstaller --clean --noconfirm packaging/bypass-tray.spec

      - name: Архив
        shell: pwsh
        run: Compress-Archive -Path "dist/Обходы/*" -DestinationPath "dist/Обходы-windows.zip"

      - name: Артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: bypass-tray-windows
          path: dist/Обходы-windows.zip
          if-no-files-found: error

      - name: Прикрепить к релизу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Обходы-windows.zip
          generate_release_notes: true
