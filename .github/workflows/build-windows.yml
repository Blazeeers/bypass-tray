name: build-windows

# Собирает портативный bypass-tray.exe и прикрепляет его к релизу.
# Запуск: пуш тега вида v1.2.3 (или вручную из вкладки Actions).
# Собранный .exe самодостаточен — на целевом ПК Python не нужен.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверка синтаксиса
        run: python -m compileall -q src packaging

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Импорт-проверка
        env:
          PYTHONPATH: src
        run: |
          python -c "import bypass_tray.runtime, bypass_tray.autostart, bypass_tray.wizard, bypass_tray.components, bypass_tray.xray"
          python -c "from bypass_tray import runtime; print('frozen:', runtime.is_frozen(), 'data_dir:', runtime.data_dir())"

      - name: Иконка
        run: python packaging/make_icon.py

      - name: Сборка .exe
        run: pyinstaller --clean --noconfirm packaging/bypass-tray.spec

      - name: Артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: bypass-tray-windows
          path: dist/bypass-tray.exe
          if-no-files-found: error

      - name: Прикрепить к релизу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bypass-tray.exe
          generate_release_notes: true
